name: CI/CD

on:
  push:
    branches: [master, main]
    # Documentation-only changes do not need a build.
    paths-ignore:
      - '**.md'
      - 'readme_assets/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.env.example'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'readme_assets/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.env.example'
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'tests/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore IncidentAlert.sln

      - name: Build
        run: dotnet build IncidentAlert.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test IncidentAlert.sln -c Release --no-build
          --logger "trx;LogFilePrefix=results"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  smoke:
    name: End-to-end smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Report → moderate → publish
        run: bash scripts/smoke-test.sh

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish ${{ matrix.service.name }} image
    # Images are only published from the default branch, after the tests and the smoke test pass.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: incidentalert, dockerfile: IncidentAlert/Dockerfile }
          - { name: incidentalert-management, dockerfile: IncidentAlert-Management/Dockerfile }
          - { name: incidentalert-ml, dockerfile: IncidentAlert-ML/Dockerfile }
          - { name: incidentalert-statistics, dockerfile: IncidentAlert-Statistics/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
